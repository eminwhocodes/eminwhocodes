<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Emin — Software Architect">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14"/>
      <stop offset="45%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0e1a2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="1020" cy="40" r="180" fill="#22d3ee" opacity="0.07"/>
  <circle cx="1120" cy="240" r="120" fill="#38bdf8" opacity="0.05"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#cyan)"/>
  <rect x="72" y="70" width="4" height="180" rx="2" fill="url(#cyan)"/>
  <rect x="72" y="70" width="4" height="180" rx="2" fill="url(#glow)"/>

  <text x="100" y="130" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1" fill="#f8fafc">Emin</text>
  <text x="100" y="178" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600" fill="#22d3ee">Software Architect</text>
  <text x="100" y="222" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#94a3b8">systems · apis · daemons · web · tooling</text>
</svg>
